<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>در حال انتقال...</title>
    <script>
        var path = window.location.pathname;
        // گرفتن شماره میز (مثلاً عدد 1 از مسیر /1)
        var tableNum = path.replace(/^\/|\/$/g, ''); 
        
        // هدایت مستقیم کاربر به دامنه اصلی بدون نیاز به کلمه studio
        if(tableNum && !isNaN(tableNum)) {
            window.location.href = "https://cafehdidar.github.io/?table=" + tableNum;
        } else {
            window.location.href = "https://cafehdidar.github.io/";
        }
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: Tahoma; direction: rtl;">
        در حال انتقال به منوی دیجیتال کافه دیدار...
    </div>
</body>
</html>
